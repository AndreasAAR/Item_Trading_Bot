name: Multi-Platform Profile Diff Listener

on:
  schedule:
    - cron: '*/15 * * * *'  # Polls Tradera, Blocket & Facebook every 15 minutes via fast HTTP
  workflow_dispatch:        # Allows manual 1-click trigger in GitHub UI

concurrency:
  group: multi-platform-sync
  cancel-in-progress: false

jobs:
  watch:
    name: Lightweight HTTP Profile Diff & Auto-Reconcile
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Auth Session States
        env:
          BLOCKET_AUTH_STATE: ${{ secrets.BLOCKET_AUTH_STATE }}
          FB_AUTH_STATE: ${{ secrets.FB_AUTH_STATE }}
          TRADERA_AUTH_STATE: ${{ secrets.TRADERA_AUTH_STATE }}
        run: |
          mkdir -p data
          if [ -n "$BLOCKET_AUTH_STATE" ]; then
            echo "$BLOCKET_AUTH_STATE" > data/blocket_auth_state.json
            echo "Restored Blocket session state."
          fi

          if [ -n "$FB_AUTH_STATE" ]; then
            echo "$FB_AUTH_STATE" > data/fb_auth_state.json
            echo "Restored Facebook session state."
          fi

          if [ -n "$TRADERA_AUTH_STATE" ]; then
            echo "$TRADERA_AUTH_STATE" > data/tradera_auth_state.json
            echo "Restored Tradera session state."
          fi

      - name: Fast HTTP Profile Diff Pre-Check (~4s, No Browser)
        id: precheck
        run: |
          python -u -m src.cli watch --once --dry-run

      - name: Install Playwright Chromium (Only When Action Needed)
        if: steps.precheck.outputs.browser_needed == 'true'
        run: |
          playwright install --with-deps chromium

      - name: Apply Profile Diffs & Reconcile Cross-Platform
        run: |
          python -u -m src.cli watch --once --headless

      - name: Persist Database Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          if [ -f data/sync_store.db ]; then
            git add -f data/sync_store.db
            if git diff --staged --quiet; then
              echo "No database changes to commit."
            else
              git commit -m "chore: profile diff listener database update [skip ci]"
              git pull --rebase origin main || true
              git push
            fi
          fi

